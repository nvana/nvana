<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" fill="none" role="img" aria-label="nvana">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="50%" stop-color="#6E44FF"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.5 0; 0.5 0; -0.5 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="620" y2="0">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="55%" stop-color="#6E44FF"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,monospace }
    </style>
  </defs>

  <text x="0" y="72" font-size="64" font-weight="700" fill="url(#ink)" letter-spacing="-1">nvana<tspan
    fill="#FF6B6B">_<animate attributeName="fill-opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <path d="M1 96 H620" stroke="url(#rule)" stroke-width="2.5" stroke-linecap="round"
    stroke-dasharray="620" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="620;0" dur="2s" begin="0.2s" fill="freeze"
      calcMode="spline" keySplines=".4 0 .2 1" keyTimes="0;1"/>
  </path>

  <text x="2" y="128" font-size="14" fill="#8892a6" letter-spacing="2.5">building quiet machines for loud numbers</text>
</svg>
