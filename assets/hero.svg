<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="nvana">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#12091f"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="50%" stop-color="#6E44FF"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.5 0; 0.5 0; -0.5 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E44FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowA">
      <stop offset="0%" stop-color="#6E44FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6E44FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7f8cff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>

    <clipPath id="frame"><rect width="1000" height="280" rx="18"/></clipPath>

    <style>
      .drift  { animation: drift 14s ease-in-out infinite alternate; }
      .drift2 { animation: drift2 18s ease-in-out infinite alternate; }
      .drift3 { animation: drift3 11s ease-in-out infinite alternate; }
      .rise   { animation: rise 1.1s cubic-bezier(.2,.7,.3,1) both; }
      .d1 { animation-delay: .25s } .d2 { animation-delay: .45s } .d3 { animation-delay: .65s }
      .d4 { animation-delay: .8s }  .d5 { animation-delay: .95s } .d6 { animation-delay: 1.1s }
      .d7 { animation-delay: 1.25s }
      .blink  { animation: blink 1.05s steps(1) infinite; }
      @keyframes drift  { from { transform: translate(0,0) }      to { transform: translate(90px,26px) } }
      @keyframes drift2 { from { transform: translate(0,0) }      to { transform: translate(-70px,-22px) } }
      @keyframes drift3 { from { transform: translate(0,0) scale(1) } to { transform: translate(40px,-30px) scale(1.15) } }
      @keyframes rise   { from { transform: translateY(14px) } to { transform: translateY(0) } }
      @keyframes blink  { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        .drift,.drift2,.drift3,.blink,.rise { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <g class="drift"><ellipse cx="220" cy="90"  rx="300" ry="190" fill="url(#glowA)"/></g>
    <g class="drift2"><ellipse cx="820" cy="210" rx="320" ry="180" fill="url(#glowB)"/></g>
    <g class="drift3"><ellipse cx="620" cy="60"  rx="220" ry="140" fill="url(#glowC)"/></g>

    <!-- sparks -->
    <g fill="#ffffff">
      <circle cx="120" cy="210" r="1.6" opacity="0.7">
        <animate attributeName="cy" values="210;60;210" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" cy="250" r="1.3" opacity="0.6">
        <animate attributeName="cy" values="250;40;250" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="230" r="1.8" opacity="0.5">
        <animate attributeName="cy" values="230;70;230" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="930" cy="200" r="1.2" opacity="0.6">
        <animate attributeName="cy" values="200;50;200" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- title -->
    <g font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,monospace">
      <text class="rise d1" x="60" y="118" font-size="82" font-weight="700" fill="url(#ink)">nvana<tspan fill="#FF6B6B">▌<animate attributeName="fill-opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>

      <text class="rise d3" x="62" y="158" font-size="17" fill="#aab4d4" letter-spacing="3">
        building quiet machines for loud numbers
      </text>

      <g font-size="13" letter-spacing="2" fill="#8f9ac2">
        <g class="rise d4"><rect x="60"  y="192" width="86"  height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#6E44FF" stroke-opacity="0.45"/><text x="103" y="212" text-anchor="middle">fintech</text></g>
        <g class="rise d5"><rect x="156" y="192" width="106" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#6E44FF" stroke-opacity="0.45"/><text x="209" y="212" text-anchor="middle">real-time</text></g>
        <g class="rise d6"><rect x="272" y="192" width="98"  height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#6E44FF" stroke-opacity="0.45"/><text x="321" y="212" text-anchor="middle">dataviz</text></g>
        <g class="rise d7"><rect x="380" y="192" width="80"  height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#6E44FF" stroke-opacity="0.45"/><text x="420" y="212" text-anchor="middle">cloud</text></g>
        <g class="rise d7"><rect x="470" y="192" width="62"  height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#FF6B6B" stroke-opacity="0.55"/><text x="501" y="212" text-anchor="middle">ai</text></g>
      </g>
    </g>

    <!-- sweeping light -->
    <rect x="-400" y="0" width="400" height="280" fill="url(#sweep)" opacity="0.18">
      <animate attributeName="x" values="-400;1000" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- bottom accent line -->
    <rect x="0" y="276" width="1000" height="4" fill="url(#ink)"/>
    <rect width="1000" height="280" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
