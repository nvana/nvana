<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#0A66C2" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#6E44FF" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#FF6B6B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="1000" height="2" fill="url(#g)"/>
  <rect y="4" width="160" height="4" rx="2" fill="url(#spark)" opacity="0.85">
    <animate attributeName="x" values="-160;1000" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
